<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="stylesheet" href="estilo/styli.css">
</head>
<body>
    <main>
       
        <section id="login">
            <div id="imagem">
               
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vinda(o). faça o login para acessar sua conta e poder fazer as confugurações do seu ambiente</p>
                <form action="" method="post" autocomplete="on">
                    <!-- Email -->
                    <div class="campo">
                        
                        
                            <span class="material-symbols-outlined">
                    deployed_code_account
                            </span>
                        <input type="email" name="" id="email" placeholder="Seu E-mail" autocomplete="email"  maxlength="30" required>
                     <label for="email">Usuario</label>
                </div>

                    <br>
                    <!-- Senha -->
                    <div class="campo">
                      <span class="material-symbols-outlined">
                          key
                        </span>
                            <input type="password" name="" placeholder="*******" autocomplete="current-password" id="sen" required minlength="8"  
                            maxlength="30"> 
                          <label for="sen">Senha</label>
                    </div>
                    <br>
                    <!-- Botões -->
                     <input type="submit" value="ENTAR">

                     <a href="esqueceu.html" class="botao">Esqueci a senha
                         <span class="material-symbols-outlined">
                            mail
                        </span>
                     </a>
                </form>

            </div>
        </section>
    </main>
</body>
</html>
